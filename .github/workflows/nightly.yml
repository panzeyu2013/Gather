name: Nightly quality and integration

on:
  schedule:
    # 每天 18:00 UTC（Asia/Shanghai 次日 02:00）；不与 PR 套件争抢 runner。
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality baselines + model integration
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            desktop/native/gather-core/.build
            ~/Library/Caches/org.swift.swiftpm
          key: nightly-core-${{ runner.os }}-${{ hashFiles('desktop/native/gather-core/Package.swift') }}
          restore-keys: |
            nightly-core-${{ runner.os }}-
            core-${{ runner.os }}-
      - name: Build core benchmarks (release)
        run: swift build -c release --package-path desktop/native/gather-core
      - name: Quality baselines
        # 质量指标从默认套件迁出，但**不是**只打印：benchmark 内置阈值（precision/
        # recall/ARI/fp/noise）超限会非零退出，这里直接把退出码交给 job。NDJSON 只
        # 用于人工看趋势，绿灯以此步为准。
        run: |
          set -euo pipefail
          desktop/native/gather-core/.build/release/gather-core-benchmarks --quality | grep '^{' | tee quality.ndjson
          desktop/native/gather-core/.build/release/gather-core-benchmarks --margin | grep '^{' | tee margin.ndjson
      - name: Performance smoke + LSH exact recall
        # --smoke 的 lsh 档断言 selfRecall=1.0、exactPairs>=100、exactRecall@0.85 >= 0.45。
        run: |
          set -euo pipefail
          desktop/native/gather-core/.build/release/gather-core-benchmarks --smoke | grep '^{' | tee smoke.ndjson
      - name: Incremental reuse + duration gate
        # 2 万张 + 新增 100 张：recomputed=1、reused>=1、新增全部进组、耗时 < 10s。
        run: |
          set -euo pipefail
          desktop/native/gather-core/.build/release/gather-core-benchmarks --incremental | grep '^{' | tee incremental.ndjson
      - name: Model integration tests
        # 仅夜间跑 SFace/CoreML + Vision 真实推理；PR 默认套件不跑这些用例。
        env:
          GATHER_MODEL_TESTS: '1'
        run: >-
          swift test --package-path desktop/native/gather-core --no-parallel
          --filter 'FaceIdentityArchitectureTests|FaceEmbeddingModelTests|FaceInferenceTests'
      - name: 2GB backup + 20k culling performance gates
        # 2GB 备份与 20k 分页默认跳过，只在夜间跑；失败会阻断夜间绿灯。
        env:
          GATHER_BACKUP_PERF: '1'
          GATHER_CULLING_PERF: '1'
        run: >-
          swift test --package-path desktop/native/gather-core --no-parallel
          --filter 'BackupPerfTests|CullingPagingPerfTests|CullingServicePerfTests'
      - name: 20k grid UI performance gate
        # 网格首屏/布局性能门默认跳过；此前 CI 从不设置 GATHER_UI_PERF，
        # 导致“20k 首屏 p95 < 800ms”只有人工可复现。
        env:
          GATHER_UI_PERF: '1'
        run: >-
          swift test --package-path desktop/native/gather-app --no-parallel
          --filter 'CullingGridPerfTests'
      - name: T0 quality-gate CLI self-check
        # 质量门 CLI 编译产物可用性自检（真实 400 张标注集仍是外部验收）。
        run: desktop/native/gather-core/.build/release/gather-triage-eval --help
      - name: Full random parity matrix
        env:
          GATHER_TEST_MATRIX_STEPS: '200'
        run: >-
          swift test --package-path desktop/native/gather-core --no-parallel
          --filter 'ClusterGraphIncrementalAssemblyTests|IncrementalClustererReconciliationTests'
      - name: Unsigned bundle assembly
        # PR 门禁只跑测试（不链接 GatherApp 可执行、不组装 .app）；打包/Info.plist/
        # 资源/本地化 bundle 的回归在夜间补一次完整组装（未签名，不涉公证）。
        run: ./desktop/native/build.sh
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gather-quality-metrics
          path: |
            quality.ndjson
            margin.ndjson
            smoke.ndjson
            incremental.ndjson
          retention-days: 30
