name: CI

on:
  # Temporarily disabled while CI native-module ABI handling is fixed.
  # Run this workflow manually from GitHub Actions when needed.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@gather/shared
      - name: Typecheck
        run: npx tsc -p desktop/tsconfig.main.json --noEmit && npx tsc -p desktop/tsconfig.renderer.json --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:vitest
