name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gather-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --package-path desktop/native/gather-core

  gather-app:
    runs-on: macos-14
    needs: gather-core
    steps:
      - uses: actions/checkout@v4
      - name: App tests
        run: swift test --package-path desktop/native/gather-app
      - name: Native bundle build
        run: ./desktop/native/build.sh
