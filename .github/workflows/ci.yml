name: Native CI

on:
  push:
    branches: [main, refactor]
    # WP6c：tag 推送触发 release job（signed/notarized universal bundle）。
    tags: ['v*']
  pull_request:
  # 手动发版：必须提供 version（tag 触发时忽略该输入，改用 tag 名）。
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version for manual runs, e.g. 3.1.0 (required; tag pushes use the tag name)'
        required: true
        type: string

concurrency:
  # 发布（tag push / workflow_dispatch）不能被同 ref 的普通 push 取消；PR 与
  # 分支 push 仍取消旧 run。group 带 event_name，手动发版与分支 CI 不共享队列。
  group: native-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) }}

permissions:
  contents: read

jobs:
  boundary:
    name: Legacy boundary scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: R0.3 legacy boundary scan
        run: ./scripts/check-no-legacy.sh
      # B8.4：字符串命令面（Router/check-command-surface.sh）已删除，命令面
      # 断言并入 check-no-legacy 的 R5 enforced 规则。

  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    needs: boundary
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cleanup ratchet
        run: ./scripts/check-cleanup-ratchet.sh
      # legacy boundary 已由 boundary job 先跑（gates needs: boundary），这里
      # 不再重复执行，避免同一门禁在同一次 run 里跑两遍。
      - name: Layering
        run: ./scripts/check-layering.sh
      - name: Domain events
        run: ./scripts/check-domain-events.sh
      - name: Domain writes
        run: ./scripts/check-domain-writes.sh
      - name: Duplicate symbols
        run: ./scripts/check-duplicate-symbols.sh --strict
      - name: Test catalog
        run: ./scripts/check-test-catalog.sh --strict
      - name: Preview surface
        run: ./scripts/check-preview-surface.sh --strict
      - name: Design system ratchet
        run: ./scripts/check-design-system.sh
      - name: SELECT * ratchet
        run: ./scripts/check-select-star.sh --strict
      - name: Protocol surface
        run: ./scripts/check-protocol-surface.sh --strict
      - name: Coded errors
        run: ./scripts/check-coded-errors.sh
      - name: Backlog evidence
        run: ./scripts/check-backlog-evidence.sh
      # 仓库层卫生：脚本语法（bash -n stderr 为空）/editorconfig/Markdown 相对链接/
      # 本地化用法/scripts 缓存产物/shellcheck。纯 Linux、无 Swift 依赖，与上面各门禁同 job。
      - name: Repo hygiene
        run: ./scripts/check-repo-hygiene.sh
      # 文档事实：README / docs/README / docs/DEVELOPMENT 的基线数字与门禁清单
      # 必须与源码计算一致（targets/API/schema/本地化 key/门禁脚本数）。
      - name: Docs facts
        run: ./scripts/check-docs-facts.sh
      # 性能反模式 ratchet：per-call DateFormatter/JSONEncoder/NSRegularExpression/...
      # 构造点不得高于 docs/baselines/perf-baseline.json（只许降，新增热点必须走共享缓存）。
      - name: Perf ratchet
        run: ./scripts/check-perf-ratchet.sh
      # G0–G5 结构门禁（2026-11-18 架构评审 Wave 4）：锁序 / target 依赖图 /
      # 模块规模 / 并发标注白名单 / Application 符号越界 / app public 面。
      # 纯 Linux、JSON 基线 ratchet；基线见 docs/baselines/（structure / surface / cleanup / perf / design-system / port-row）。
      - name: Lock order
        run: ./scripts/check-lock-order.sh --strict
      - name: Import graph
        run: ./scripts/check-import-graph.sh --strict
      - name: Module size
        run: ./scripts/check-module-size.sh --strict
      - name: Concurrency whitelist
        run: ./scripts/check-concurrency-whitelist.sh --strict
      - name: Layer symbols
        run: ./scripts/check-layer-symbols.sh --strict
      - name: App public surface
        run: ./scripts/check-public-surface-app.sh --strict
      # G6（2026-11-18 Wave 5 / M8+M10）：端口准入台账 + 行类型表面 ratchet。
      - name: Port row surface
        run: ./scripts/check-port-row-surface.sh --strict
      # P1-2（2026-11-18 安全审计）：结构门禁的负样本自测进 CI —— 正则/解析器
      # 被改坏时 gate 自身会「静默全绿」，这里用 mktemp fixture 证明违规仍会红。
      # 10 道各 <0.5s，不写仓库（cleanup/perf-ratchet 的 self-test 各约 20s，不进 per-PR）。
      - name: Lock order self-test
        run: ./scripts/check-lock-order.sh --self-test
      - name: Import graph self-test
        run: ./scripts/check-import-graph.sh --self-test
      - name: Module size self-test
        run: ./scripts/check-module-size.sh --self-test
      - name: Concurrency whitelist self-test
        run: ./scripts/check-concurrency-whitelist.sh --self-test
      - name: Layer symbols self-test
        run: ./scripts/check-layer-symbols.sh --self-test
      - name: App public surface self-test
        run: ./scripts/check-public-surface-app.sh --self-test
      - name: Port row surface self-test
        run: ./scripts/check-port-row-surface.sh --self-test
      - name: Layering self-test
        run: ./scripts/check-layering.sh --self-test
      - name: Domain events self-test
        run: ./scripts/check-domain-events.sh --self-test
      - name: Coded errors self-test
        run: ./scripts/check-coded-errors.sh --self-test
      - name: Test catalog self-test
        run: ./scripts/check-test-catalog.sh --self-test
      - name: Release bundle verifier self-test
        run: ./scripts/verify-release-bundle.sh --self-test
      # 测试工具自测（task-44）：profile-tests.sh 的事件流解析器与 test-shard.sh
      # 的静态单元清单都是纯 Linux Python，各 <1s；合成夹具保证工具被改坏时仍
      # 会红，而不是「静默全绿」。不进 macOS 测试 job（那里只跑真实 swift test）。
      - name: Profile tests self-test
        run: ./scripts/profile-tests.sh --self-test
      - name: Test shard self-test
        run: ./scripts/test-shard.sh --self-test

  gather-core:
    name: gather-core tests
    # 只在 macOS 26+ 上验证（2026-10-29 移除 macos-14）：工具链需 Swift 6.0+
    # 且 SDK ≥26，macos-14 镜像默认是 Xcode 15.4/Swift 5.10，包都无法解析。
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain version
        # 排障入口：runner 镜像换代（Xcode/SDK/Swift）先看这一行，别再靠猜。
        # 同时输出工具链指纹（Swift + Xcode 版本）给下面 Cache 的 key/restore-keys：
        # 旧工具链的 SwiftPM 缓存（manifest/模块产物）换代后不复用，避免半旧缓存。
        id: toolchain
        run: |
          SWIFT_INFO="$(swift --version)"
          XCODE_INFO="$(xcodebuild -version 2>/dev/null || true)"
          printf '%s\n' "$SWIFT_INFO" "$XCODE_INFO"
          echo "fingerprint=$(printf '%s\n' "$SWIFT_INFO" "$XCODE_INFO" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            desktop/native/gather-core/.build
            ~/Library/Caches/org.swift.swiftpm
          # key = OS + 架构 + 工具链指纹 + manifest 哈希；restore 只在前三者相同时匹配。
          key: core-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('desktop/native/gather-core/Package.swift') }}
          restore-keys: core-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Sources warnings
        # P3-5：只对 Sources 开 -warnings-as-errors；测试 target 告警不阻断。
        run: ./scripts/check-warnings.sh core
      - name: Core tests
        # 串行 + 输出落盘 + 1200s 看门狗（2026-10-29 假死复盘）：swift-testing 的
        # --parallel 是同进程并发（worker≈核数），本仓大量阻塞型锁（GatherLogger /
        # DBConnection / 读池）在 3–4 vCPU runner 上会耗尽协作线程池（实测 21 分钟
        # 零输出）。参数/日志/失败摘要统一收在 scripts/run-swift-tests.sh（与本地
        # scripts/test.sh 同一套 env 口径），并行入口只留给本地。
        run: ./scripts/run-swift-tests.sh core
      - name: Upload test log on failure
        # T14：失败时保留全量日志（脚本默认落 $RUNNER_TEMP），排障不必 rerun。
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gather-core-tests-log
          path: ${{ runner.temp }}/gather-core-tests.log
          if-no-files-found: ignore
      # WP7：schema 工具是 DDL 真相源的独立消费方；在 core job 内验证 55 表/
      # user_version=1（当前唯一 Schema）/外键 0 违规，避免只靠测试间接覆盖。
      - name: Schema verification
        run: swift run --package-path desktop/native/gather-core gather-schema verify

  gather-app:
    name: gather-app tests
    # 与 gather-core 同口径：只在 macOS 26+ 验证。两 job 无 artifact 依赖，去掉
    # needs 后并行（T12：少一轮排队墙钟；release 仍是 needs [gates, gather-app]）。
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain version
        # 与 gather-core job 同口径：排障入口 + 下面的 Cache key 工具链指纹因子。
        id: toolchain
        run: |
          SWIFT_INFO="$(swift --version)"
          XCODE_INFO="$(xcodebuild -version 2>/dev/null || true)"
          printf '%s\n' "$SWIFT_INFO" "$XCODE_INFO"
          echo "fingerprint=$(printf '%s\n' "$SWIFT_INFO" "$XCODE_INFO" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            desktop/native/gather-app/.build
            ~/Library/Caches/org.swift.swiftpm
          # app 以 path 依赖 ../gather-core：core 的 Package.swift 变化同样会让 app 的
          # .build 失效，所以 manifest 哈希同时包含两个包的 Package.swift。
          key: app-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('desktop/native/gather-app/Package.swift', 'desktop/native/gather-core/Package.swift') }}
          restore-keys: app-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
      # T8：原独立 "App executable build" 已删——它与 Sources warnings 重复：
      # swift build 默认构建全部 target（含 GatherApp 可执行），而 warnings 步骤还多了
      # -warnings-as-errors，菜单/场景装配的编译回归仍会被拦下。
      # 测试只构建 test target；.app 组装与 SDK/linker flags 仍由 release 覆盖。
      - name: Sources warnings
        # P3-5：GatherUI/GatherHost/GatherApp 的 Sources 告警即失败。
        run: ./scripts/check-warnings.sh app
      - name: App tests
        # 与 gather-core 同口径：串行 + 输出落盘 + 1200s 看门狗（细节统一在
        # scripts/run-swift-tests.sh）。并行 SIGSEGV 已于 2026-10-29 修掉，但并行仍
        # 会放大阻塞型锁的线程池耗尽风险，故 CI 不启用；本地用 scripts/test.sh app。
        run: ./scripts/run-swift-tests.sh app
      - name: Upload test log on failure
        # T14：失败时保留全量日志（脚本默认落 $RUNNER_TEMP），排障不必 rerun。
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gather-app-tests-log
          path: ${{ runner.temp }}/gather-app-tests.log
          if-no-files-found: ignore

  # 原 toolchain-compat（macos-latest 上的 drift guard）已删除：core/app 两个
  # 测试 job 现在就跑在最新镜像（macos-26）上，单独再构建一遍纯属重复。
  # 若将来把测试钉在旧镜像、又想提前感知新工具链，再按 macos-latest 加回来。

  # WP6c：可复现发布。只在 v* tag 或手动 dispatch 时运行；版本/SDK/签名凭据全部
  # 显式注入，缺任何一项都在 build.sh 的 GATHER_RELEASE=1 下失败，不静默跳过。
  # 需要的 secrets（签名/公证 secret 只在 Build step 注入，不放在 job env，避免
  # 上传 artifact 等无关 step 也能读取）：
  #   CODESIGN_IDENTITY       Developer ID Application: ... (TEAMID)  必填
  #   MACOS_CERT_P12          base64 的 .p12                          必填
  #   MACOS_CERT_PASSWORD     .p12 密码                               必填
  #   KEYCHAIN_PASSWORD       临时钥匙串密码                          必填
  #   GATHER_NOTARY_PROFILE   仅 self-hosted runner 可用（需预先 store-credentials）；
  #                           hosted runner 请留空，改用下面三件套
  #   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_APP_PASSWORD           App Store Connect 凭据
  # 环境要求（release-audit P1）：本 job 必须在 **self-hosted macOS 26 runner** 上运行，
  # 该 runner 需预装：① Xcode 26+（Swift/SDK ≥26，Liquid Glass）；② 授权 Capture One
  # Plugin SDK（Capture_One_Plugin_SDK_(Mac)_v1.0.1/，被 .gitignore 排除）；③ 签名/公证
  # 凭据（secrets 只在 Build step 注入，不放进 job env）。Hosted macos-26 不提供 ②，
  # Preflight step 会立即失败并给出 self-hosted 指引（此 job 在公开 runner 上从未成功
  # 跑完，见 release-audit）；换 runner 只需把 runs-on 换成对应 self-hosted 标签。
  release:
    name: Release bundle (universal, signed, notarized)
    # Liquid Glass 需要 Mach-O 的 LC_BUILD_VERSION.sdk >= 26（见 gather-app/
    # Package.swift）。发布固定在 macos-26；换 self-hosted runner 时若没有 SDK 26，
    # "Resolve release SDK and version" 会 fail closed，而不是静默产出无 Liquid Glass 的包。
    runs-on: macos-26
    needs: [gates, gather-core, gather-app]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 120
    env:
      GATHER_ARCHS: universal
      GATHER_NOTARIZE: '1'
      GATHER_RELEASE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git describe 需要 tag 与提交历史；版本回退依赖它。
          fetch-depth: 0
      - name: Preflight licensed Capture One SDK
        # 授权 SDK 不在仓库内，hosted macos-26 镜像不提供：build.sh 的 GATHER_RELEASE=1
        # 会在组装前 exit 1。这里在下载/构建前给出安装指引，别等整次 job 跑完才红。
        run: |
          if [ ! -d "Capture_One_Plugin_SDK_(Mac)_v1.0.1" ] || [ ! -f desktop/coplugin/Makefile ]; then
            echo "::error::release requires the licensed Capture One plugin SDK (Capture_One_Plugin_SDK_(Mac)_v1.0.1/, gitignored) and desktop/coplugin/Makefile."
            echo "::error::hosted macos-26 runners cannot provide the SDK: use a self-hosted macOS 26 runner with the SDK installed."
            exit 1
          fi
      - name: Resolve release SDK and version
        id: version
        # 一次 xcrun 同时记录 GATHER_SDK_VERSION 并断言 SDK>=26（不再分两个 step 重复探测）。
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SDK_VERSION="$(xcrun --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          case "$SDK_MAJOR" in
            ''|*[!0-9]*) echo "::error::cannot parse SDK version '$SDK_VERSION'"; exit 1 ;;
          esac
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::release requires the macOS 26 SDK (Liquid Glass); this runner provides $SDK_VERSION. Use macos-26 or a self-hosted runner with Xcode 26."
            exit 1
          fi
          echo "GATHER_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "SDK: $SDK_VERSION"
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; fi
          if [ -z "$VERSION" ]; then VERSION="$INPUT_VERSION"; fi
          if [ -z "$VERSION" ]; then
            echo "::error::release job needs a v* tag or workflow_dispatch input 'version'" >&2
            exit 1
          fi
          echo "GATHER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::release requires MACOS_CERT_P12, MACOS_CERT_PASSWORD and KEYCHAIN_PASSWORD secrets"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/gather-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/gather-cert.p12"
          security import "$RUNNER_TEMP/gather-cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/gather-cert.p12"
      - name: Build universal signed bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          # self-hosted runner 若已 store-credentials，可设 profile；hosted runner
          # 请留空，让 build.sh 走下面的 Apple ID 三件套。
          GATHER_NOTARY_PROFILE: ${{ secrets.GATHER_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: ./desktop/native/build.sh
      - name: Verify release zip
        # 发布侧独立验收（P1：此前 Gather.zip 从未解包验证）：解包最终 zip 复核
        # 双切片/版本/插件/App Intents 元数据/签名/entitlements/公证/校验和，全部
        # fail closed。build.sh 负责构建期断言，本 step 只认最终产物；本地可用同一
        # 命令复跑：./scripts/verify-release-bundle.sh release/Gather.zip。
        # Linux 上没有 ditto/lipo/codesign 等工具，不能跑这条验收（Linux 用
        # --self-test 验证脚本自身的 fail-closed 行为）；正式验收需 macOS 26+ /
        # Xcode 26 SDK，构建机还须是预装授权 C1 SDK 的 self-hosted runner。
        run: |
          ( cd release && shasum -a 256 Gather.zip > Gather.zip.sha256 )
          ./scripts/verify-release-bundle.sh release/Gather.zip
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Gather-${{ steps.version.outputs.version }}
          path: |
            release/Gather.zip
            release/Gather.zip.sha256
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/gather-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
