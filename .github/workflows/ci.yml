name: Native CI

on:
  push:
    branches: [main, refactor]
    # WP6c：tag 推送触发 release job（signed/notarized universal bundle）。
    tags: ['v*']
  pull_request:
  # 手动发版：必须提供 version（tag 触发时忽略该输入，改用 tag 名）。
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version for manual runs, e.g. 3.1.0 (required; tag pushes use the tag name)'
        required: true
        type: string

concurrency:
  # 发布（tag push / workflow_dispatch）不能被同 ref 的普通 push 取消；PR 与
  # 分支 push 仍取消旧 run。group 带 event_name，手动发版与分支 CI 不共享队列。
  group: native-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) }}

permissions:
  contents: read

jobs:
  boundary:
    name: Legacy boundary scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: R0.3 legacy boundary scan
        run: ./scripts/check-no-legacy.sh
      # B8.4：字符串命令面（Router/check-command-surface.sh）已删除，命令面
      # 断言并入 check-no-legacy 的 R5 enforced 规则。

  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    needs: boundary
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Docs consistency
        run: ./scripts/check-docs.sh --strict
      - name: Cleanup ratchet
        run: ./scripts/check-cleanup-ratchet.sh
      # legacy boundary 已由 boundary job 先跑（gates needs: boundary），这里
      # 不再重复执行，避免同一门禁在同一次 run 里跑两遍。
      - name: Layering
        run: ./scripts/check-layering.sh
      - name: Duplicate symbols
        run: ./scripts/check-duplicate-symbols.sh --strict
      - name: Test catalog
        run: ./scripts/check-test-catalog.sh --strict
      - name: Preview surface
        run: ./scripts/check-preview-surface.sh --strict
      - name: SELECT * ratchet
        run: ./scripts/check-select-star.sh --strict
      - name: Protocol surface
        run: ./scripts/check-protocol-surface.sh --strict

  gather-core:
    name: gather-core tests
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            desktop/native/gather-core/.build
            ~/Library/Caches/org.swift.swiftpm
          key: core-${{ runner.os }}-${{ hashFiles('desktop/native/gather-core/Package.swift') }}
          restore-keys: core-${{ runner.os }}-
      - name: Core tests
        # 串行：TraceLogging/Logger 两个套件替换进程级 GatherLogger.output；
        # 跨套件并行会丢日志行，历史 CI 上出现过假红。
        run: swift test --package-path desktop/native/gather-core --no-parallel --explicit-target-dependency-import-check error
      # WP7：schema 工具是 DDL 真相源的独立消费方；在 core job 内验证 43 表/
      # user_version=2（当前 Schema V2）/外键 0 违规，避免只靠测试间接覆盖。
      - name: Schema verification
        run: swift run --package-path desktop/native/gather-core gather-schema verify

  gather-app:
    name: gather-app tests + bundle
    runs-on: macos-14
    needs: gather-core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # WP7：CI 显式注入 GATHER_SDK_VERSION；manifest 仅在未注入时按
      # SDKROOT → xcrun → 14.0 自行探测。这里固定在 job 环境里，保证 test 与
      # bundle 两次求值同一值。
      - name: Resolve SDK version
        run: |
          SDK_VERSION="$(xcrun --show-sdk-version)"
          echo "GATHER_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "GATHER_SDK_VERSION=$SDK_VERSION"
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            desktop/native/gather-app/.build
            ~/Library/Caches/org.swift.swiftpm
          key: app-${{ runner.os }}-${{ hashFiles('desktop/native/gather-app/Package.swift') }}
          restore-keys: app-${{ runner.os }}-
      - name: App tests
        # 串行执行的理由（P0-2）：app 用例共享 MainActor 状态层与进程级语言/通知槽，
        # 默认并行在调度满载时会拖穿等待窗口（历史 flake：ControlCenter/Gallery
        # 生命周期断言）。CI、README、DEVELOPMENT 的 app 测试命令统一 --no-parallel。
        # --manifest-cache none：GATHER_SDK_VERSION 是 manifest 求值期输入，
        # SwiftPM 的 manifest 缓存不把它计入 key；CI 的 .build 缓存可能来自
        # 旧 runner/SDK，必须强制重算再注入 linker flags。
        run: swift test --package-path desktop/native/gather-app --no-parallel --manifest-cache none --explicit-target-dependency-import-check error
      - name: App parallel smoke
        # 验收声称并行 3 次绿；CI 必须实际覆盖一次（不设 --no-parallel）。
        run: swift test --package-path desktop/native/gather-app --manifest-cache none --explicit-target-dependency-import-check error
      - name: Native bundle build
        run: ./desktop/native/build.sh

  toolchain-compat:
    name: Newest toolchain build (drift guard)
    runs-on: macos-latest
    needs: boundary
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain version
        run: swift --version && xcodebuild -version
      - name: Core build on newest toolchain
        run: swift build --package-path desktop/native/gather-core --explicit-target-dependency-import-check error
      - name: App build on newest toolchain
        run: swift build --package-path desktop/native/gather-app --explicit-target-dependency-import-check error

  # WP6c：可复现发布。只在 v* tag 或手动 dispatch 时运行；版本/SDK/签名凭据全部
  # 显式注入，缺任何一项都在 build.sh 的 GATHER_RELEASE=1 下失败，不静默跳过。
  # 需要的 secrets（签名/公证 secret 只在对应 step 注入，不放在 job env，避免
  # 上传 artifact 等无关 step 也能读取）：
  #   CODESIGN_IDENTITY       Developer ID Application: ... (TEAMID)  必填
  #   MACOS_CERT_P12          base64 的 .p12                          必填
  #   MACOS_CERT_PASSWORD     .p12 密码                               必填
  #   KEYCHAIN_PASSWORD       临时钥匙串密码                          必填
  #   GATHER_NOTARY_PROFILE   仅 self-hosted runner 可用（需预先 store-credentials）；
  #                           hosted runner 请留空，改用下面三件套
  #   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_APP_PASSWORD           App Store Connect 凭据
  release:
    name: Release bundle (universal, signed, notarized)
    # Liquid Glass 需要 Mach-O 的 LC_BUILD_VERSION.sdk >= 26（见 gather-app/
    # Package.swift）。需要 macos-26 或装有 Xcode 26 的 self-hosted runner；
    # 若目标 runner 仍无 SDK 26，"Assert release SDK" 会 fail closed，而不是
    # 静默产出无 Liquid Glass 的包。
    runs-on: macos-26
    needs: [gates, gather-app]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 120
    env:
      GATHER_ARCHS: universal
      GATHER_NOTARIZE: '1'
      GATHER_RELEASE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git describe 需要 tag 与提交历史；版本回退依赖它。
          fetch-depth: 0
      - name: Resolve SDK and version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SDK_VERSION="$(xcrun --show-sdk-version)"
          echo "GATHER_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "SDK: $SDK_VERSION"
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$INPUT_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::release job needs a v* tag or workflow_dispatch input 'version'" >&2
            exit 1
          fi
          echo "GATHER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"
      # P1-4/P2：发布包必须用 macOS 26 SDK 链接，否则 Mach-O 的
      # LC_BUILD_VERSION.sdk 会让 AppKit 强制旧外观（无 Liquid Glass）。
      # macos-14 镜像无法提供 Xcode 26；这里 fail closed，避免静默发布。
      - name: Assert release SDK
        run: |
          SDK_VERSION="$(xcrun --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "release SDK: $SDK_VERSION"
          case "$SDK_MAJOR" in
            ''|*[!0-9]*)
              echo "::error::cannot parse SDK version '$SDK_VERSION'"
              exit 1
              ;;
          esac
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::release requires the macOS 26 SDK (Liquid Glass); this runner provides $SDK_VERSION. macos-14 cannot provide Xcode 26; move this job to macos-26 or a self-hosted Xcode 26 runner."
            exit 1
          fi
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::release requires MACOS_CERT_P12, MACOS_CERT_PASSWORD and KEYCHAIN_PASSWORD secrets"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/gather-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/gather-cert.p12"
          security import "$RUNNER_TEMP/gather-cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/gather-cert.p12"
      - name: Build universal signed bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          # self-hosted runner 若已 store-credentials，可设 profile；hosted runner
          # 请留空，让 build.sh 走下面的 Apple ID 三件套。
          GATHER_NOTARY_PROFILE: ${{ secrets.GATHER_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: ./desktop/native/build.sh
      # GatherLink.coplugin 的架构/版本/minos 必须与 universal app 一致。
      # build.sh 在 SDK 存在时按 GATHER_ARCHS 逐切片编译并 lipo，release 模式
      # 缺 SDK 直接 exit 1；这里再做发布侧独立复核，防止 runner 缓存混入。
      # 授权 SDK 不在仓库内，release runner 必须先安装，否则本 job 失败。
      - name: Verify Capture One plugin architecture
        run: |
          PLUGIN_BINARY="release/Gather.app/Contents/PlugIns/GatherLink.coplugin/Contents/MacOS/GatherLink"
          if [ ! -f "$PLUGIN_BINARY" ]; then
            echo "::error::universal release must embed GatherLink.coplugin; build.sh refuses GATHER_RELEASE=1 without the licensed Capture One SDK + Makefile. Install the SDK on the release runner."
            exit 1
          fi
          ARCHS="$(lipo -archs "$PLUGIN_BINARY")"
          echo "GatherLink.coplugin architectures: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *)
                echo "::error::universal release requires the $want slice in GatherLink.coplugin (lipo -archs: $ARCHS)"
                exit 1
                ;;
            esac
          done
          PLUGIN_PLIST="release/Gather.app/Contents/PlugIns/GatherLink.coplugin/Contents/Info.plist"
          APP_PLIST="release/Gather.app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$PLUGIN_PLIST")" = "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST")"
          test "$(plutil -extract CFBundleVersion raw -o - "$PLUGIN_PLIST")" = "$(plutil -extract CFBundleVersion raw -o - "$APP_PLIST")"
          PLUGIN_MINOS="$(vtool -show-build "$PLUGIN_BINARY" | awk '$1=="minos"{print $2; exit}')"
          echo "GatherLink.coplugin minos: $PLUGIN_MINOS"
          test "$PLUGIN_MINOS" = "14.0"
      - name: Verify bundle
        run: |
          APP=release/Gather.app
          APP_BINARY="$APP/Contents/MacOS/Gather"
          plutil -p "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleIconFile raw -o - "$APP/Contents/Info.plist")" = "AppIcon"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          ARCHS="$(lipo -archs "$APP_BINARY")"
          echo "app architectures: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *)
                echo "::error::universal release requires the $want slice in Gather (lipo -archs: $ARCHS)"
                exit 1
                ;;
            esac
          done
          for arch in $ARCHS; do
            MINOS="$(vtool -arch "$arch" -show-build "$APP_BINARY" | awk '$1=="minos"{print $2; exit}')"
            SDK="$(vtool -arch "$arch" -show-build "$APP_BINARY" | awk '$1=="sdk"{print $2; exit}')"
            echo "Mach-O $arch: minos=$MINOS sdk=$SDK"
            test "$MINOS" = "14.0"
            test "$SDK" = "$GATHER_SDK_VERSION"
          done
          BUILD_INFO="$APP/Contents/Resources/build-info.json"
          test -s "$BUILD_INFO"
          plutil -convert xml1 -o /dev/null "$BUILD_INFO"
          cat "$BUILD_INFO"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/gather-codesign-dv.txt
          grep -q 'Runtime Version' /tmp/gather-codesign-dv.txt
          grep -q 'Timestamp' /tmp/gather-codesign-dv.txt
          codesign -d --entitlements :- "$APP" > /tmp/gather-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.automation.apple-events' /tmp/gather-entitlements.plist
          xcrun stapler validate "$APP"
          spctl -a -t exec -vvv "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "${GATHER_VERSION#v}"
          ( cd release && shasum -a 256 Gather.zip > Gather.zip.sha256 )
          cat release/Gather.zip.sha256
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Gather-${{ steps.version.outputs.version }}
          path: |
            release/Gather.zip
            release/Gather.zip.sha256
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/gather-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
